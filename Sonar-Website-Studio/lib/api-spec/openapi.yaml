openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sonar
    description: SONAR educational assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sonar/insight:
    post:
      operationId: askSonarInsight
      tags: [sonar]
      summary: Ask the SONAR educational assistant
      description: Streams a cautious educational answer about canine hearing and sound perception.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SonarInsightInput"
      responses:
        "200":
          description: Server-sent events containing assistant text chunks.
          content:
            text/event-stream: {}
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI provider could not complete the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The AI provider is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SonarInsightMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - role
        - content
    SonarInsightInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/SonarInsightMessage"
      required:
        - messages
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

